<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Aanal 💖</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: 'Comic Sans MS', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 25px;
    border-radius: 25px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    z-index: 2;
  }

  h1 { color: #ff4d6d; margin-bottom: 5px; }
  h2 { margin-top: 0; }

  img.main {
    width: 100%;
    border-radius: 20px;
    margin: 15px 0;
  }

  button {
    padding: 12px 28px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
  }

  #yes { background: #ff4d6d; color: white; }
  #no { background: #ddd; position: absolute; }

  #typewriter {
    font-size: 16px;
    margin-top: 15px;
    color: #333;
    min-height: 80px;
  }

  .signature {
    margin-top: 10px;
    font-style: italic;
    color: #ff4d6d;
  }

  /* Floating hearts */
  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 24px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    z-index: 1;
  }

  @keyframes floatUp {
    from {
      transform: translateY(0);
      opacity: 1;
    }
    to {
      transform: translateY(-120vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Aanal 💕</h1>
  <h2>Will you be my Valentine?</h2>

  <button id="yes">YES 💖</button>
  <button id="no">NO 🙈</button>
</div>

<!-- Romantic instrumental -->
<audio id="music" loop muted>
  <source src="love-romantic-hopeful-music-333017.mp3" type="audio/mpeg">
</audio>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const card = document.getElementById("card");
  const music = document.getElementById("music");

  // NO button escapes
  noBtn.addEventListener("mouseover", () => {
    noBtn.style.left = Math.random() * 80 + "%";
    noBtn.style.top = Math.random() * 80 + "%";
  });

  // Typewriter effect
  function typeWriter(text, elementId, speed = 35) {
    let i = 0;
    const el = document.getElementById(elementId);
    el.innerHTML = "";

    function typing() {
      if (i < text.length) {
        el.innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, speed);
      }
    }
    typing();
  }

  // Floating hearts generator
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💓";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }

  // YES click action
  yesBtn.addEventListener("click", () => {
    card.innerHTML = `
      <h1>I Love You ❤️</h1>
      <h2>You just made me the happiest person 😍</h2>

      <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExY3Z1MnloMmVlN212YmRoYmg2YzUzNmYzYmZwdHZkZnd2MW94eDdiaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/nWKcbc20FHvs4/giphy.gif"
           style="width:100%; border-radius:20px; margin-top:15px;">

      <p id="typewriter"></p>
      <div class="signature">– Ronak ❤️</div>
    `;

    // 🎵 Music (iOS safe)
    music.muted = false;
    music.volume = 0.6;
    music.play().catch(() => {});

    // 📱 Haptic vibration (mobile)
    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200]);
    }

    // 💓 Start hearts
    setInterval(createHeart, 500);

    // ✍️ Start typewriter text
    typeWriter(
      "From the moment you walked into my life, everything felt brighter. ❤️ " +
      "Thank you for choosing me, for loving me, and for being YOU. " +
      "Happy Valentine’s Day, Aanal 💘",
      "typewriter",
      35
    );
  });
</script>

</body>
</html>
